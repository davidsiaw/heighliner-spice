name: spice-rspec

'on':
  push:
    branches:
    - master
  pull_request:

permissions:
  contents: read

jobs:
  rspec:
    strategy:
      fail-fast: true
      matrix:
        ruby:
          - '3.4'
          - '4.0'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Run rspec
      run: bundle exec rspec
